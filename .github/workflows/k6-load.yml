name: k6 Load Tests

on:
  push:
    branches: [main]
    paths:
      - 'desafio-4-k6/**'
      - '.github/workflows/k6-load.yml'
  pull_request:
    paths:
      - 'desafio-4-k6/**'
      - '.github/workflows/k6-load.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de execução do k6
        type: choice
        options: [smoke, load, challenge]
        default: smoke

permissions:
  contents: read

jobs:
  k6-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-4-k6
    env:
      K6_PROFILE: ${{ github.event.inputs.profile || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Validar scripts (sem carga)
        run: ./scripts/check.sh
      - name: Executar k6
        run: ./scripts/run.sh "$K6_PROFILE"
      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-${{ env.K6_PROFILE }}
          path: |
            desafio-4-k6/results/**/console.log
            desafio-4-k6/results/**/metadata.txt
            desafio-4-k6/results/**/summary.json
            desafio-4-k6/results/**/summary.html
          if-no-files-found: ignore
