name: API Tests

on:
  push:
    branches: [main]
    paths:
      - 'desafio-1-api/**'
      - '.github/workflows/api-tests.yml'
  pull_request:
    paths:
      - 'desafio-1-api/**'
      - '.github/workflows/api-tests.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desafio-1-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desafio-1-api/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: desafio-1-api/results/
          if-no-files-found: ignore
